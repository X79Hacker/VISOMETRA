<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VISOMETRA // Matrix</title>
<style>
:root{
  --bg:#05060f;--bar:#080a16;--panel:#0a0c1a;--panel-2:#0c0f1c;
  --line:#1c2137;--line-2:#262c47;
  --green:#00ff9d;--green-2:#00e676;
  --cyan:#3ee6ff;--pink:#e040fb;--amber:#ffc400;--red:#ff4d6a;
  --text:#dfe4f5;--text-dim:#8790b5;--text-mute:#565f85;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:var(--line) #080a16}
body{
  background:var(--bg);color:var(--text);
  font-family:Consolas,'Courier New',ui-monospace,monospace;
  font-size:13px;line-height:1.5;min-height:100vh;
}
.topbar{
  height:60px;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:var(--bar);border-bottom:1px solid var(--line);
  flex-wrap:nowrap;overflow:hidden;
}
.dash-btn{
  background:var(--panel);color:var(--text-dim);
  border:1px solid var(--line-2);padding:10px 18px;
  font-family:inherit;font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;transition:all .15s;text-decoration:none;
  display:inline-flex;align-items:center;flex-shrink:0;
}
.dash-btn:hover{border-color:var(--green);color:var(--green)}
.title-block{display:flex;align-items:center;gap:10px;min-width:0;overflow:hidden}
.title-main{color:var(--green);font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
.title-slash{color:var(--text-mute);font-weight:700}
.title-id{color:var(--green);font-size:14px;font-weight:700;letter-spacing:.5px}
.topbar .spacer{flex:1}
.zoom-pill{
  display:flex;align-items:center;gap:2px;flex-shrink:0;
  background:var(--panel);border:1px solid var(--line-2);
  padding:4px 6px;margin-left:22px;
}
.zoom-pill button{
  background:transparent;border:none;color:var(--text-dim);
  font-family:inherit;font-size:15px;line-height:1;
  width:24px;height:24px;cursor:pointer;transition:color .15s;
}
.zoom-pill button:hover{color:var(--green)}
.zoom-pill .zicon{
  display:flex;align-items:center;justify-content:center;
  width:26px;height:24px;color:var(--text-dim);
}
.zoom-pill .zicon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.zoom-pill .zval{color:var(--text-mute);font-size:11px;padding:0 6px;min-width:40px;text-align:center}
.progress-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
.progress-outer{width:170px;height:10px;background:#0f1424;border:1px solid var(--line-2);overflow:hidden}
.progress-inner{height:100%;background:var(--green);width:0%;transition:width .3s}
.progress-label{color:var(--green);font-size:12px;font-weight:700;letter-spacing:.5px;white-space:nowrap}

.btn-row{display:flex;align-items:center;gap:10px;padding:14px 20px;flex-wrap:nowrap;overflow-x:auto;border-bottom:1px solid var(--line)}
.online-tag{color:var(--text-dim);font-size:12px;letter-spacing:.6px;white-space:nowrap}
.online-tag b{color:var(--text)}
.mode-btn{
  background:var(--panel);color:var(--text);
  border:1px solid var(--line-2);padding:10px 18px;
  font-family:inherit;font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.mode-btn:hover{border-color:var(--green);color:var(--green)}
.mode-btn.on{background:rgba(0,255,157,.13);border-color:var(--green);color:var(--green)}
.mode-btn.on2{background:rgba(62,230,255,.12);border-color:var(--cyan);color:var(--cyan)}
.mode-btn.go{background:var(--green);color:#02160c;border-color:var(--green)}
.mode-btn.go:hover{background:#2dffb8}
.mode-btn.warn{border-color:rgba(255,196,0,.5);color:var(--amber)}
.mode-btn.warn:hover{background:rgba(255,196,0,.12);border-color:var(--amber)}
.mode-btn:disabled{opacity:.35;cursor:not-allowed}

.ops-row{display:flex;gap:18px;padding:16px 20px;align-items:stretch;flex-wrap:nowrap}
.minimap{width:212px;flex-shrink:0;border:1px solid var(--line-2);background:#0b0e18;padding:6px;transition:border-color .15s}
.minimap:hover{border-color:var(--green)}
.minimap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.minimap-cap{color:var(--text-mute);font-size:10px;letter-spacing:1px;margin-top:6px;text-align:center;text-transform:uppercase}
.logpanel{flex:1;min-width:0;border:1px solid var(--line-2);background:var(--panel);padding:12px 16px}
.log-head{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
.logbox{max-height:200px;overflow-y:auto;font-size:11.5px}
.logbox div{padding:2px 0;color:var(--text-dim);white-space:pre-wrap;word-break:break-word}
.logbox .t{color:var(--text-mute)}
.logbox .who{color:var(--red);font-weight:700}
.logbox .ev{color:var(--text)}

.matrix-wrap{padding:6px 20px 40px;overflow:auto}
.matrix{display:grid;gap:0;width:fit-content;margin:0 auto;background:#000}
.cell{
  position:relative;cursor:pointer;overflow:hidden;background:#0b0e18;
  border:1px solid rgba(200,210,240,.28);
  transition:border-color .12s;
}
.cell:hover{border-color:var(--green);z-index:3}
.cell.done{border-color:var(--green);border-width:1px}
.cell.drawn{border-color:rgba(224,64,251,.65)}
.cell.sel-pick{border-color:var(--amber);border-style:dashed}
.cell canvas{display:block;width:100%;height:100%;pointer-events:none}
.cell .coord{
  position:absolute;top:1px;left:3px;font-size:9px;
  color:rgba(20,20,30,.75);pointer-events:none;
}
.cell.dark .coord{color:rgba(255,255,255,.72);text-shadow:0 1px 2px rgba(0,0,0,.85)}
.cell .badge{
  position:absolute;right:4px;bottom:2px;
  color:var(--green);font-size:10px;font-weight:700;
  text-shadow:0 1px 3px rgba(0,0,0,.95);pointer-events:none;
}
.cell .badge.warn{color:var(--amber)}
.cell .badge.err{color:var(--red)}
.cell .badge.zero{color:rgba(200,206,230,.75);font-weight:600}
.cell .drawn-mark{
  position:absolute;left:4px;bottom:2px;font-size:9px;
  color:var(--pink);text-shadow:0 1px 2px rgba(0,0,0,.9);pointer-events:none;
}

.modal{position:fixed;inset:0;z-index:200;background:rgba(3,4,10,.9);display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line-2);padding:22px 24px;width:100%;max-width:560px;max-height:86vh;overflow-y:auto}
.modal-box h3{color:var(--amber);font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:16px}
.modal-box .mrow{display:flex;justify-content:space-between;gap:16px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.modal-box .mrow:last-child{border-bottom:none}
.modal-box .mrow .mval{color:var(--green);font-weight:700}
.modal-foot{margin-top:18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:14px}
.field label{display:block;color:var(--text-dim);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--panel-2);border:1px solid var(--line-2);color:var(--text);font-family:inherit;font-size:13px;padding:9px 11px;outline:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.hintline{color:var(--text-mute);font-size:11px;margin-top:6px}
.hidden{display:none!important}
</style>

<div class="topbar">

<script>
"use strict";

const GRID = 16;
const PATCHES = GRID * GRID;
const DB_NAME = 'epicycle-dashboard';
const DB_VER = 3;   // v3 adds the 'traces' store (trace.html)
const STORE_FILES = 'files';
const STORE_PATCH = 'patches';

const S = {
  db:null, files:[], current:-1, user:null,
  mode:'view', copyBuf:null, pickCell:-1,
  scale:1, cellPx:74, sortCol:'amp', sortDir:-1
};

const PRESETS = [];
const WORKER_CODE = "";

/* ---- storage (shared with dashboard-front.html and editor.html) ---- */
function openDB(){
  return new Promise((res,rej)=>{
    let r;
    try{ r = indexedDB.open(DB_NAME, DB_VER); }catch(err){ rej(err); return; }
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE_FILES)) db.createObjectStore(STORE_FILES,{keyPath:'id'});
      if(!db.objectStoreNames.contains(STORE_PATCH)) db.createObjectStore(STORE_PATCH,{keyPath:'fileId'});
      if(!db.objectStoreNames.contains('traces')) db.createObjectStore('traces',{keyPath:'fileId'});
    };
    r.onsuccess = e => { const db=e.target.result; db.onversionchange=()=>db.close(); res(db); };
    r.onerror   = e => rej(e.target.error);
    r.onblocked = () => rej(new Error('database upgrade blocked by another open tab'));
    setTimeout(()=>rej(new Error('database open timed out')), 4000);
  });
}
// IndexedDB; shared-store.js sends the same calls to the server so all users share them
const storeReq = SharedStore.wrap(localStoreReq);
function localStoreReq(name, mode, method, arg){
  return new Promise((res,rej)=>{
    let r;
    try{
      const os = S.db.transaction(name, mode).objectStore(name);
      r = arg === undefined ? os[method]() : os[method](arg);
    }catch(err){ rej(err); return; }
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
const dbAllFiles   = ()   => storeReq(STORE_FILES,'readonly','getAll');
const dbPutFile    = f    => storeReq(STORE_FILES,'readwrite','put', f);
const dbPutPatches = rec  => storeReq(STORE_PATCH,'readwrite','put', rec);
const dbGetPatches = id   => storeReq(STORE_PATCH,'readonly','get', id);
const dbGetFile    = id   => storeReq(STORE_FILES,'readonly','get', id);

/* The image list (names and dates only: one small request) plus the full data
   — pixels and cell drawings — of just the image being opened. Loading every
   image's drawings on every page open was what made switching slow. */
async function loadFiles(wantId){
  const list = (await Episodes.scoped(await SharedStore.list(localStoreReq))).filter(r => r && r.id && r.name);
  const files = list.map(rec => ({
    id: rec.id, name: rec.name, blob: null,
    createdAt: rec.createdAt || Date.now(),
    rows: rec.rows || GRID, cols: rec.cols || GRID,
    patchW: rec.patchW || 3.4, patchH: rec.patchH || 3.4, unit: rec.unit || 'cm',
    uploadedBy: rec.uploadedBy || null, uploadedAt: rec.uploadedAt || null,
        editedAreas: rec.editedAreas || null,
    patches: Array.from({length: PATCHES}, emptyPatch)
  })).sort((a,b)=>Episodes.context ? 0 : b.createdAt-a.createdAt);
  const f = files.find(x => x.id === wantId) || files[0];
  if(f){
    f.loaded = true;
    const [rec, pr] = await Promise.all([ dbGetFile(f.id).catch(()=>null), dbGetPatches(f.id).catch(()=>null) ]);
    if(rec && rec.blob) f.blob = rec.blob;
    if(pr && Array.isArray(pr.patches)){
      for(let i=0;i<Math.min(PATCHES, pr.patches.length);i++){
        if(pr.patches[i]) f.patches[i] = Object.assign(emptyPatch(), pr.patches[i]);
      }
    }
  }
  return files;
}

function fileRecord(f){
  return { id:f.id, name:f.name, blob:f.blob, createdAt:f.createdAt,
           rows:f.rows, cols:f.cols, patchW:f.patchW, patchH:f.patchH, unit:f.unit,
           uploadedBy:f.uploadedBy||null, uploadedAt:f.uploadedAt||null, editedAreas:f.editedAreas||null };
}
/* Areas of cells measured from the user's own outline (not the trace page's
   piece): {index: {area, by}} — kept on the file record for the trace page. */
function computeEditedAreas(f){
  const out = {};
  f.patches.forEach((p,i) => {
    if(p && !p.fromTrace && p.measurements && p.active && p.active.length){
      const m = p.measurements;
      out[i] = { area: m.bArea!==undefined ? m.bArea : m.sArea, by: p.editedBy || null };
    }
  });
  return out;
}
async function savePatches(f){
  f.editedAreas = computeEditedAreas(f);
  try{
    await dbPutPatches({ fileId: f.id, patches: f.patches, savedAt: Date.now() });
    await dbPutFile(fileRecord(f));
  }catch(err){ log('ERROR','Save failed: '+err.message); }
}

function $(id){ return document.getElementById(id); }
function hex(n){ return ('0000000'+n.toString(16)).slice(-8); }
function num(n,d){ return (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toString(); }
function emptyPatch(){ return {points:null,coeffs:null,active:null,centroid:null,tableData:null,measurements:null,marked:false}; }
function isDone(p){ return !!(p && p.active && p.active.length); }
function coordOf(i){ return Math.floor(i/GRID) + ',' + (i%GRID); }
function measuredCount(f){ let n=0; for(let i=0;i<f.patches.length;i++) if(isDone(f.patches[i])) n++; return n; }
function fileNow(){ return S.current>=0 ? S.files[S.current] : null; }
function patchOf(f,i){ if(!f.patches[i]) f.patches[i]=emptyPatch(); return f.patches[i]; }

function fileBitmap(f, onReady){
  if(!f || !f.blob){ onReady(null); return; }
  if(f._bmp){ onReady(f._bmp); return; }
  f._pending = f._pending || [];
  f._pending.push(onReady);
  if(f._loading) return;
  f._loading = true;
  createImageBitmap(f.blob).then(bmp=>{
    f._bmp = bmp;
    const q = f._pending || []; f._pending = [];
    q.forEach(fn => fn(bmp));
  }).catch(()=>{
    const q = f._pending || []; f._pending = [];
    q.forEach(fn => fn(null));
  });
}

/* ---- navigation ---- */
function param(name){
  const v = new URLSearchParams(location.search).get(name);
  return (v === null || v === '') ? null : v;
}
function editorURL(id, idx){ return Episodes.link('editor.html?f=' + encodeURIComponent(id) + '&c=' + idx); }

function stamp(){
  const d = new Date();
  let h = d.getHours(); const ap = h>=12?'PM':'AM'; h = h%12 || 12;
  const p = n => String(n).padStart(2,'0');
  return p(h)+':'+p(d.getMinutes())+' '+ap;
}
function log(kind, text){
  const box = $('logBox');
  const line = document.createElement('div');
  const who = kind==='ERROR' ? '<span class="who">'+S.user+'</span>'
            : kind==='WARN'  ? '<span style="color:var(--amber);font-weight:700">'+S.user+'</span>'
            : '<span class="who">'+S.user+'</span>';
  line.innerHTML = '<span class="t">'+stamp()+'</span>  '+who+'  <span class="ev">'+text+'</span>';
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
  while(box.children.length > 300) box.removeChild(box.firstChild);
}

function setMode(m){
  S.mode = m;
  $('modeView').classList.toggle('on', m==='view');
  $('modeCopy').classList.toggle('on', m==='copy');
  $('modePaste').classList.toggle('on2', m==='paste');
  if(m==='paste') S.pickCell = -1;
  log('INFO', m==='view' ? 'VIEW MATRIX — click any cell to open the editor'
        : m==='copy' ? 'COPY MODE — click a cell to copy its measurement'
        : 'PASTE MODE — click a source cell, then a target cell to paste');
  renderMatrix();
}
function renderMatrix(){
  const f = fileNow();
  $('emptyState').style.display = f ? 'none' : 'block';
  const m = $('matrix');
  m.style.display = f ? 'grid' : 'none';
  if(!f){ $('fileId').textContent='—'; $('progLabel').textContent='0/256'; $('progBar').style.width='0%'; return; }
  $('fileId').textContent = hex(f.createdAt % 0xFFFFFFF);
  $('lnkTrace').href = Episodes.link('trace.html?f=' + encodeURIComponent(f.id));
  m.style.gridTemplateColumns = 'repeat('+GRID+','+S.cellPx+'px)';
  m.style.gridTemplateRows = 'repeat('+GRID+','+S.cellPx+'px)';
  m.innerHTML = '';
  const frag = document.createDocumentFragment();
  for(let i=0;i<PATCHES;i++){
    const p = f.patches[i];
    const el = document.createElement('div');
    el.className = 'cell';
    if(isDone(p)) el.classList.add('done');
    else if(p.points) el.classList.add('drawn');
    if(i === S.pickCell && S.mode === 'paste') el.classList.add('sel-pick');
    const cv = document.createElement('canvas');
    cv.width = S.cellPx; cv.height = S.cellPx;
    el.appendChild(cv);
    const c = document.createElement('div'); c.className='coord'; c.textContent = coordOf(i); el.appendChild(c);
    const b = document.createElement('div');
    if(isDone(p)){
      b.className = 'badge';
      b.textContent = p.marked ? '✓' : (p.measurements && p.measurements.fArea>0 ? 'OK' : 'ERR');
      if(!(p.measurements && p.measurements.fArea>0)) b.classList.add('err');
    }else{
      // not measured (no COMPUTE result): area 0 by default. A cell that has a drawing
      // but no result still gets the pink ◦ mark below.
      b.className = 'badge zero'; b.textContent = '0';
    }
    el.appendChild(b);
    if(p.points && !isDone(p)){
      const dm = document.createElement('div'); dm.className='drawn-mark'; dm.textContent='◦'; el.appendChild(dm);
    }
    el.addEventListener('click', () => onCellClick(i));
    el.title = 'Cell [' + coordOf(i) + '] — click to measure' +
      (p.editedBy ? '\nLast edited by ' + p.editedBy + (p.editedAt ? ' · ' + new Date(p.editedAt).toLocaleString() : '') : '') +
      (p.marked && p.markedBy ? '\nMarked complete by ' + p.markedBy : '');
    frag.appendChild(el);
    paintCell(cv, f, i, el);
  }
  m.appendChild(frag);
  const done = measuredCount(f);
  $('progLabel').textContent = done + '/' + PATCHES;
  $('progBar').style.width = (done/PATCHES*100).toFixed(1) + '%';
  $('gridZoomLabel').textContent = Math.round(S.cellPx/74*100) + '%';
  paintMinimap();
}
function paintCell(cv, f, idx, cellEl){
  const ctx = cv.getContext('2d');
  const N = cv.width;
  ctx.clearRect(0,0,N,N);
  fileBitmap(f, function(bmp){
    if(!bmp){ ctx.fillStyle='#111'; ctx.fillRect(0,0,N,N); return; }
    const side = Math.min(bmp.width, bmp.height);
    const r = Math.floor(idx/GRID), c = idx % GRID;
    const sw = side/GRID, sh = side/GRID;
    const sx = (bmp.width-side)/2 + c*sw;
    const sy = (bmp.height-side)/2 + r*sh;
    ctx.drawImage(bmp,sx,sy,sw,sh,0,0,N,N);

    // Coordinate label must stay legible on both pale and dark patches.
    if(cellEl){
      const d = ctx.getImageData(Math.floor(N/2), Math.floor(N/2), 1, 1).data;
      const lum = (0.2126*d[0] + 0.7152*d[1] + 0.0722*d[2]) / 255;
      cellEl.classList.toggle('dark', lum < 0.45);
    }

    const p = f.patches[idx];
    if(p && p.points && p.points.length > 1){
      const k = N / 500;
      ctx.strokeStyle = isDone(p) ? 'rgba(0,255,157,.95)' : 'rgba(224,64,251,.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.points[0][0]*k, p.points[0][1]*k);
      for(let i=1;i<p.points.length;i++) ctx.lineTo(p.points[i][0]*k, p.points[i][1]*k);
      ctx.closePath(); ctx.stroke();
    }
  });
}
function paintMinimap(){
  const f = fileNow(); const cv = $('miniCanvas');
  const ctx = cv.getContext('2d');
  const N = cv.width;
  ctx.fillStyle = '#0b0e18'; ctx.fillRect(0,0,N,N);
  if(!f) return;
  fileBitmap(f, function(bmp){
    if(!bmp) return;
    const side = Math.min(bmp.width,bmp.height);
    ctx.drawImage(bmp,(bmp.width-side)/2,(bmp.height-side)/2,side,side,0,0,N,N);
    const cell = N/GRID;
    for(let i=0;i<PATCHES;i++){
      const p = f.patches[i];
      if(!p || (!isDone(p) && !p.points)) continue;
      const r = Math.floor(i/GRID), c = i%GRID;
      ctx.fillStyle = isDone(p) ? 'rgba(0,255,157,.5)' : 'rgba(224,64,251,.45)';
      ctx.fillRect(c*cell, r*cell, cell, cell);
    }
    ctx.strokeStyle='rgba(0,255,157,.85)'; ctx.lineWidth=1.5;
    ctx.strokeRect(.75,.75,N-1.5,N-1.5);
  });
}
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function onCellClick(i){
  const f = fileNow(); if(!f) return;
  if(S.mode === 'copy'){
    const p = f.patches[i];
    if(!isDone(p)){ log('WARN','COPY: cell ['+coordOf(i)+'] has no measurement'); return; }
    S.copyBuf = deepClone(p);
    log('INFO','COPY: cell ['+coordOf(i)+'] -> clipboard ('+num(p.measurements.fArea,4)+' '+f.unit+'²)');
    setMode('paste');
    return;
  }
  if(S.mode === 'paste'){
    if(S.pickCell < 0){ S.pickCell = i; log('INFO','PASTE: source cell ['+coordOf(i)+'] selected'); renderMatrix(); return; }
    if(!S.copyBuf){ log('WARN','PASTE: clipboard empty — copy a cell first'); return; }
    const wasDone = isDone(f.patches[i]);
    f.patches[i] = deepClone(S.copyBuf);
    f.patches[i].marked = false;
    Session.stamp(f.patches[i]);
    savePatches(f);
    log('INFO','PASTE: cell ['+coordOf(i)+'] updated'+(wasDone?' (was measured)':''));
    renderMatrix();
    return;
  }
  openEditor(i);
}
/* The epicycle editor lives in editor.html; hand it the file and cell. */
function openEditor(i){
  const f = fileNow(); if(!f) return;
  localStorage.setItem('dash-current', f.id);
  log('INFO','OPEN: cell ['+coordOf(i)+'] -> editor');
  location.href = editorURL(f.id, i);
}
function markComplete(){
  const f = fileNow(); if(!f) return;
  let n = 0;
  for(let i=0;i<PATCHES;i++){
    const p = f.patches[i];
    if(isDone(p) && p.measurements && p.measurements.fArea>0 && !p.marked){ p.marked = true; p.markedBy = S.user; Session.stamp(p); n++; }
  }
  if(!n){ log('WARN','MARK COMPLETE: nothing new to mark'); return; }
  savePatches(f);
  log('INFO','MARK COMPLETE: '+n+' cell(s) flagged');
  renderMatrix();
}

/* Unmeasured cells (no COMPUTE result) are exported with 0 for every value. */
const ZERO_MEASUREMENTS = { sArea:0, fArea:0, perim:0, w:0, h:0, meanErr:0, cx:0, cy:0, dir:'' };
const measuredOk = p => isDone(p) && !!p.measurements;

function exportCSV(){
  const f = fileNow();
  if(!f){ log('WARN','EXPORT CSV: no map loaded'); return; }
  const rows = [['Cell_Row','Cell_Col','Index','Coord','Unit','Area_Exact','Area_Fourier','Perimeter',
                 'Width','Height','CentroidX','CentroidY','Direction','Circles','Marked','Measured']];
  let n = 0;
  for(let i=0;i<PATCHES;i++){
    const p = f.patches[i];
    const done = measuredOk(p);
    const m = done ? p.measurements : ZERO_MEASUREMENTS;
    const parts = coordOf(i).split(',');
    rows.push([parts[0], parts[1], i, '['+coordOf(i)+']', f.unit,
      m.sArea.toFixed(6), m.fArea.toFixed(6), m.perim.toFixed(6),
      m.w.toFixed(6), m.h.toFixed(6), m.cx.toFixed(6), m.cy.toFixed(6), m.dir,
      done ? p.active.length : 0, p.marked?'yes':'no', done?'yes':'no']);
    if(done) n++;
  }
  const csv = rows.map(r => r.map(v=>{
    const s=String(v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  download(new Blob([csv],{type:'text/csv'}), 'sector-map-measurements.csv');
  log('INFO','EXPORT CSV: '+PATCHES+' cell(s) written — '+n+' measured, '+(PATCHES-n)+' unmeasured as 0');
}
/* Every cell's Fourier circles: one row per circle — frequency k, amplitude
   (in the unit and in patch px), phase in radians and degrees, direction and
   cumulative area. Unmeasured cells get a single row of 0 (Measured = no). */
function exportCirclesCSV(){
  const f = fileNow();
  if(!f){ log('WARN','CIRCLES CSV: no map loaded'); return; }
  const sc = f.patchW/500, u = f.unit;
  const rows = [['Cell_Row','Cell_Col','Index','Coord','Measured','Cell_Area_'+u+'2','Rank','Freq_k',
                 'Amplitude_'+u,'Amplitude_px','Phase_rad','Phase_deg','Direction','CumArea_'+u+'2']];
  let cells = 0, circles = 0;
  for(let i=0;i<PATCHES;i++){
    const p = f.patches[i], r = Math.floor(i/GRID), c = i%GRID, coord = '['+coordOf(i)+']';
    if(measuredOk(p) && p.tableData && p.tableData.length){
      const m = p.measurements, area = (m.bArea!=null ? m.bArea : m.sArea);
      p.tableData.forEach(t => {
        rows.push([r, c, i, coord, 'yes', area.toFixed(6), t.rank, t.k,
          (t.amp*sc).toFixed(6), t.amp.toFixed(6), t.phase.toFixed(6), t.phaseDeg.toFixed(4),
          t.k>0?'CCW':t.k<0?'CW':'center', (t.cumArea*sc*sc).toFixed(6)]);
        circles++;
      });
      cells++;
    }else{
      rows.push([r, c, i, coord, 'no', '0.000000', 0, 0, '0.000000', '0.000000', '0.000000', '0.0000', '', '0.000000']);
    }
  }
  const csv = rows.map(row => row.map(v=>{ const s=String(v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n');
  download(new Blob(['﻿'+csv],{type:'text/csv'}), f.name.replace(/\.[^.]+$/,'')+'_cell_circles.csv');
  log('INFO','CIRCLES CSV: '+circles+' circle(s) from '+cells+' measured cell(s); '+(PATCHES-cells)+' unmeasured cell(s) as 0');
}
function exportJSON(){
  const f = fileNow();
  if(!f){ log('WARN','EXPORT JSON: no map loaded'); return; }
  const data = {
    name:f.name, createdAt:new Date(f.createdAt).toISOString(),
    grid:{rows:f.rows, cols:f.cols, patchW:f.patchW, patchH:f.patchH, unit:f.unit},
    cells:f.patches.map((p,i)=>({
      index:i, coord:'['+coordOf(i)+']', row:Math.floor(i/GRID), col:i%GRID,
      done:isDone(p), marked:!!p.marked,
      points:p.points, centroid:measuredOk(p) ? p.centroid : [0,0],
      // unmeasured cells: every measurement 0 and no circles
      measurements:measuredOk(p) ? p.measurements : Object.assign({}, ZERO_MEASUREMENTS),
      circles:measuredOk(p) ? (p.tableData||[]).map(c=>({rank:c.rank,frequency:c.k,
        amplitude:c.amp*f.patchW/500, amplitude_px:c.amp, unit:f.unit,
        phase_rad:c.phase,phase_deg:c.phaseDeg,direction:c.k>0?'CCW':c.k<0?'CW':'center',
        cum_area:c.cumArea*(f.patchW/500)*(f.patchW/500)})) : []
    }))
  };
  download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}), 'sector-map-measurements.json');
  log('INFO','EXPORT JSON: '+PATCHES+' cell(s) written');
}
function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function openCalib(){
  const f = fileNow();
  if(!f){ log('WARN','CALIBRATE: no map loaded'); return; }
  $('calibW').value = f.patchW;
  $('calibH').value = f.patchH;
  $('calibUnit').value = f.unit;
  $('calibMax').textContent = num(f.patchW*f.patchH,2)+' '+f.unit+'²';
  $('calibModal').classList.add('open');
}
function applyCalib(){
  const f = fileNow(); if(!f) return;
  const w=parseFloat($('calibW').value), h=parseFloat($('calibH').value), u=$('calibUnit').value;
  if(!(w>0) || !(h>0)){ log('ERROR','CALIBRATE: width and height must be positive'); return; }
  const oldScale = f.patchW / 500;
  const newScale = w / 500;
  const k2 = (newScale*newScale)/(oldScale*oldScale);
  const k1 = newScale/oldScale;
  let n = 0;
  for(let i=0;i<PATCHES;i++){
    const p = f.patches[i];
    const m = p.measurements;
    if(!m) continue;
    // measurements are stored in the calibrated unit, so they follow the new calibration;
    // circle amplitudes are stored in patch pixels (every page multiplies them by
    // patchW/500 to show them), so they must NOT be rescaled here — that scaled them twice
    m.sArea*=k2; m.fArea*=k2; m.perim*=k1;
    m.w*=k1; m.h*=k1; m.cx*=k1; m.cy*=k1;
    if(m.meanErr!=null) m.meanErr*=k1;
    if(m.bArea!=null) m.bArea*=k2;
    if(m.bPerim!=null) m.bPerim*=k1;
    Session.stamp(p);
    n++;
  }
  f.patchW=w; f.patchH=h; f.unit=u;
  S.scale = newScale;
  savePatches(f);
  $('calibModal').classList.remove('open');
  log('INFO','CALIBRATE: '+w+'×'+h+' '+u+' (max '+num(w*h,2)+' '+u+'²) — rescaled '+n+' measurement(s)');
  renderMatrix();
}

function setup(){
  $('modeView').addEventListener('click', ()=>setMode('view'));
  $('modeCopy').addEventListener('click', ()=>setMode('copy'));
  $('modePaste').addEventListener('click', ()=>setMode('paste'));
  $('modeCalib').addEventListener('click', openCalib);
  $('calibCancel').addEventListener('click', ()=>$('calibModal').classList.remove('open'));
  $('calibSave').addEventListener('click', applyCalib);
  $('btnExportCsv').addEventListener('click', exportCSV);
  $('btnExportJson').addEventListener('click', exportJSON);
  $('btnExportCircles').addEventListener('click', exportCirclesCSV);
  $('btnMarkComplete').addEventListener('click', markComplete);
  $('btnGridIn').addEventListener('click', ()=>{
    S.cellPx = Math.min(160, Math.round(S.cellPx*1.25));
    renderMatrix();
  });
  $('btnGridOut').addEventListener('click', ()=>{
    S.cellPx = Math.max(30, Math.round(S.cellPx/1.25));
    renderMatrix();
  });
  $('minimap').addEventListener('click', ()=>{ $('matrixWrap').scrollIntoView({behavior:'smooth'}); });
  $('btnPrevImg').addEventListener('click', ()=>stepImage(-1));
  $('btnNextImg').addEventListener('click', ()=>stepImage(1));
  // [ / ] previous / next image
  document.addEventListener('keydown', e=>{
    if(e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if($('calibModal').classList.contains('open')) return;
    if(e.key==='['){ e.preventDefault(); stepImage(-1); }
    else if(e.key===']'){ e.preventDefault(); stepImage(1); }
  });
}
/* Previous / next image in dashboard order (newest first). */
function stepImage(delta){
  const f = fileNow(); if(!f) return;
  const list = S.files.slice().sort((a,b)=>Episodes.context ? 0 : b.createdAt-a.createdAt);
  const n = list[list.findIndex(x=>x.id===f.id) + delta];
  if(!n){ log('INFO', delta < 0 ? 'This is the first image' : 'This is the last image'); return; }
  localStorage.setItem('dash-current', n.id);
  location.href = Episodes.link('sector-map-matrix.html?f=' + encodeURIComponent(n.id));
}

(async function boot(){
  // the logged-in username (session.js); corrected once the server confirms it
  S.user = (window.Session && Session.user) || 'unknown';
  $('onlineUser').textContent = S.user;
  window.addEventListener('session-user', e => { S.user = e.detail; });
  setup();
  try{
    S.db = await openDB();
    // ?f= wins; otherwise whatever the dashboard last opened (only that image is fetched in full)
    S.files = await loadFiles(param('f') || localStorage.getItem('dash-current'));
  }catch(err){
    log('ERROR','BOOT: storage unavailable: '+err.message);
    S.files = [];
  }

  let idx = S.files.findIndex(f=>f.loaded);
  if(idx < 0) idx = S.files.length ? 0 : -1;
  S.current = idx;

  log('INFO','BOOT: '+S.files.length+' map(s) available'+(idx>=0?', '+measuredCount(S.files[idx])+' measurement(s) in this one':''));
  if(S.files.length){
    const f = fileNow();
    localStorage.setItem('dash-current', f.id);
    log('INFO','Loaded '+f.name+' ('+hex(f.createdAt % 0xFFFFFFF)+') — '+measuredCount(f)+'/'+PATCHES+' measured'+(f.uploadedBy?' · uploaded by '+f.uploadedBy:''));
  }else{
    log('INFO','BOOT: no maps stored — open the Dashboard to upload one');
  }
  renderMatrix();
})();
</script>
