<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VISOMETRA // Saved Results</title>
<style>
:root{
  --bg:#05060f;--bar:#080a16;--panel:#0a0c1a;--panel-2:#0c0f1c;
  --line:#1c2137;--line-2:#262c47;
  --green:#00ff9d;--green-2:#00e676;
  --cyan:#3ee6ff;--pink:#e040fb;--amber:#ffc400;--red:#ff4d6a;
  --text:#dfe4f5;--text-dim:#8790b5;--text-mute:#565f85;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Consolas,'Courier New',ui-monospace,monospace;font-size:13px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;display:flex;align-items:center;gap:14px;padding:0 20px;background:var(--bar);border-bottom:1px solid var(--line);flex-shrink:0}
.nav-btn{background:var(--panel);color:var(--text-dim);border:1px solid var(--line-2);padding:10px 18px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap}
.nav-btn:hover{border-color:var(--green);color:var(--green)}
.title-main{color:var(--green);font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
.spacer{flex:1}
.filters{display:flex;gap:10px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}
.filters input,.filters select{background:var(--panel-2);border:1px solid var(--line-2);color:var(--text);font-family:inherit;font-size:12px;padding:8px 10px;outline:none}
.filters input:focus,.filters select:focus{border-color:var(--green)}
.filters label{color:var(--text-dim);font-size:11px;display:flex;align-items:center;gap:6px;cursor:pointer}
.filters input[type=checkbox]{accent-color:var(--green)}
.mode-btn{background:var(--panel);color:var(--text);border:1px solid var(--line-2);padding:8px 14px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.mode-btn:hover{border-color:var(--green);color:var(--green)}
.mode-btn.go{background:var(--green);color:#02160c;border-color:var(--green)}
.mode-btn:disabled{opacity:.35;cursor:not-allowed}
.count{color:var(--text-mute);font-size:11px}
.body{flex:1 1 0;min-height:0;display:flex;overflow:hidden}
.list{flex:1;min-width:0;overflow:auto}
.detail{width:440px;flex-shrink:0;overflow-y:auto;background:var(--bar);border-left:1px solid var(--line);padding:14px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{position:sticky;top:0;background:var(--panel-2);color:var(--text-dim);padding:8px 8px;text-align:left;white-space:nowrap;font-size:10.5px;text-transform:uppercase;border-bottom:1px solid var(--line);z-index:1}
td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.045);color:var(--text-dim);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.list tbody tr{cursor:pointer}
.list tbody tr:hover td{background:rgba(0,230,118,.05);color:var(--text)}
.list tbody tr.sel td{background:rgba(0,255,157,.10);color:var(--green)}
.tag{display:inline-block;padding:1px 6px;font-size:10px;border:1px solid var(--line-2)}
.tag.trace{color:var(--pink);border-color:rgba(224,64,251,.5)}
.tag.cell{color:var(--cyan);border-color:rgba(62,230,255,.45)}
.status{border:1px solid var(--line);padding:9px 12px;font-size:11.5px;margin:14px 20px;color:var(--text-dim)}
.status.err{border-color:var(--red);color:var(--red)}
.status.ok{border-color:rgba(0,230,118,.35);color:var(--green-2)}
.panel{border:1px solid var(--line);background:var(--panel);margin-bottom:10px}
.panel h4{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--amber);padding:11px 14px}
.panel .pb{padding:0 14px 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px}
.kv div:nth-child(odd){color:var(--text-mute)}
.kv div:nth-child(even){color:var(--text);font-weight:700;text-align:right}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line)}
.fp{color:var(--green-2)} .fn{color:var(--pink)} .fz{color:var(--amber)}
.empty{color:var(--text-mute);padding:30px 10px;text-align:center}
code{color:var(--cyan)}
</style>
<link rel="stylesheet" href="episodes/theme.css">
<script src="episodes/store.js"></script>
<link rel="stylesheet" href="episodes/polish.css">
</head>
<body>

<div class="topbar">
  <a class="nav-btn" href="dashboard-front.html">&#8592; Dashboard</a>
  <span class="title-main">Saved Results</span>
  <span class="count" id="who"></span>
  <div class="spacer"></div>
  <button class="mode-btn" id="btnName" title="Show only the results saved under your login">Show only mine</button>
</div>

<div class="filters">
  <input id="fImage" placeholder="Image name contains…" size="22">
  <input id="fBy" placeholder="Saved by…" size="14">
  <select id="fScope"><option value="">Cells + traces</option><option value="cell">Cells only</option><option value="trace">Whole traces only</option></select>
  <label><input type="checkbox" id="fLatest" checked> Latest per cell only</label>
  <button class="mode-btn go" id="btnLoad">Refresh</button>
  <span class="count" id="count"></span>
</div>
<div class="filters">
  <span class="count" style="color:var(--amber)">DOWNLOAD:</span>
  <a class="mode-btn go" href="api/download" style="text-decoration:none" title="measurements.csv + circles.csv + cell_areas.csv in one zip">All results (ZIP)</a>
  <a class="mode-btn" href="results/measurements.csv" download style="text-decoration:none" title="one row per saved result: areas, perimeter, size, centre…">measurements.csv</a>
  <a class="mode-btn" href="results/circles.csv" download style="text-decoration:none" title="one row per circle: frequency k, amplitude, phase, direction, cumulative area">circles.csv</a>
  <a class="mode-btn" href="results/cell_areas.csv" download style="text-decoration:none" title="area of every grid cell covered by a traced outline">cell_areas.csv</a>
  <button class="mode-btn" id="btnCsvList" disabled title="only the rows shown below">This list (CSV)</button>
  <span class="count" id="folder"></span>
</div>

<div class="status hidden" id="status" style="display:none"></div>

<div class="body">
  <div class="list">
    <table>
      <thead><tr>
        <th>Saved</th><th>By</th><th>Image</th><th>Scope</th><th>Cell</th>
        <th>Area Bézier</th><th>Area Shoelace</th><th>Area Fourier</th><th>Perimeter</th><th>Circles</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="10" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="detail" id="detail">
    <div class="empty">Click a result to see its circles (amplitude, phase, frequency) and cell areas.</div>
  </div>
</div>

<script src="session.js"></script>
<script>
"use strict";
/* ================= saved results (CSV files) =================
   Same block in editor.html, trace.html and results.html. server.py writes
   every saved result into results/measurements.csv, results/circles.csv and
   results/cell_areas.csv next to the app; GET api/download zips all three. */
const ResultsCSV = {
  async req(url, opts){
    let r;
    try{ r = await fetch(url, opts); }
    catch(e){ throw new Error('the app server is not running — start the app with server.py (start-windows.bat)'); }
    let j = null; try{ j = await r.json(); }catch(e){}
    if(!r.ok){
      if(r.status===404 || r.status===501) throw new Error('this server cannot save results — start the app with the included server.py');
      throw new Error((j && j.error) || ('HTTP '+r.status));
    }
    return j;
  },
  save(payload){ return this.req('api/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); },
  get(path){ return this.req(path); },
  saverName(ask){
    if(window.Session && Session.user) return Session.user;   // logged in: always the login name
    let n = '';
    try{ n = localStorage.getItem('db-name') || ''; }catch(e){}
    if(!n && ask){
      n = (prompt('Your name — it is saved with your results:', '') || '').trim().slice(0,60);
      if(n) try{ localStorage.setItem('db-name', n); }catch(e){}
    }
    if(!n) try{ n = localStorage.getItem('dash-user') || 'anonymous'; }catch(e){ n='anonymous'; }
    return n;
  }
};
/* small "💾 …" indicator next to the Save button */
function dbIndicator(text, kind){
  const el = document.getElementById('dbState'); if(!el) return;
  el.textContent = text; el.className = 'db-state '+(kind||'');
}
function savedStamp(){ const t=new Date(); return '💾 saved to results '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); }

const R = { rows:[], sel:null, circles:[], cells:[] };
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function n(v,d){ return v==null ? '—' : (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toString(); }
function when(ts){ const d=new Date(ts); const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function status(msg,kind){ const el=$('status'); el.style.display=msg?'block':'none'; el.className='status '+(kind||''); el.innerHTML=msg||''; }
/* CSV cells arrive as strings; empty means "no value" */
const NUMERIC=['cell_row','cell_col','cell_width','cell_height','area_bezier','area_shoelace','area_fourier','perimeter','width','height',
               'centroid_x','centroid_y','recon_error','num_circles','expected_area','percent_error',
               'rank','freq_k','amplitude','amplitude_px','phase_rad','phase_deg','cum_area','area','coverage_pct'];
function typed(r){ for(const k of NUMERIC) if(k in r) r[k] = (r[k]===''||r[k]==null) ? null : Number(r[k]); r.id=r.measurement_id; return r; }

async function fetchAll(){
  status('');
  $('rows').innerHTML='<tr><td colspan="10" class="empty">Loading…</td></tr>';
  try{
    const j=await ResultsCSV.get('api/results');
    const episode = Episodes.context ? await Episodes.get(Episodes.context) : null;
    const episodeFrames = new Set(episode?.frames || []);
    R.all=(j.rows||[]).filter(r => !Episodes.context || episodeFrames.has(r.image_id)).map(typed);
    $('folder').textContent='files: '+j.folder;
  }catch(err){
    R.all=[];
    $('rows').innerHTML='<tr><td colspan="10" class="empty">Could not load.</td></tr>';
    status('Could not read the results: '+esc(err.message),'err'); return false;
  }
  return true;
}
async function load(){ if(await fetchAll()) render(); }
function render(){
  const qi=$('fImage').value.trim().toLowerCase(), qb=$('fBy').value.trim().toLowerCase(), sc=$('fScope').value;
  let rows=R.all.filter(r=>(!qi || String(r.image_name).toLowerCase().includes(qi))
                       && (!qb || String(r.saved_by).toLowerCase().includes(qb))
                       && (!sc || r.scope===sc));
  rows.sort((a,b)=>String(b.saved_at).localeCompare(String(a.saved_at)));
  if($('fLatest').checked){          // newest result per image + scope + cell
    const seen=new Set();
    rows=rows.filter(r=>{ const k=r.image_id+'|'+r.scope+'|'+r.cell_row+'|'+r.cell_col; if(seen.has(k)) return false; seen.add(k); return true; });
  }
  R.rows=rows;
  $('count').textContent=R.rows.length+' result'+(R.rows.length===1?'':'s')+' shown · '+R.all.length+' saved in total';
  $('btnCsvList').disabled=!R.rows.length;
  if(!R.rows.length){ $('rows').innerHTML='<tr><td colspan="10" class="empty">No results yet. Press COMPUTE in the editor or on the trace page — results are saved here automatically.</td></tr>'; return; }
  $('rows').innerHTML=R.rows.map((r,i)=>{
    const u=r.unit||'', u2=u+'²';
    return '<tr data-i="'+i+'" class="'+(R.sel&&R.sel.id===r.id?'sel':'')+'">'+
      '<td>'+when(r.saved_at)+'</td><td>'+esc(r.saved_by)+'</td><td>'+esc(r.image_name)+'</td>'+
      '<td><span class="tag '+r.scope+'">'+(r.scope==='trace'?'whole trace':'cell')+'</span></td>'+
      '<td>'+(r.scope==='cell'?'['+r.cell_row+','+r.cell_col+']':'—')+'</td>'+
      '<td class="n">'+n(r.area_bezier,4)+(r.area_bezier!=null?' '+u2:'')+'</td>'+
      '<td class="n">'+n(r.area_shoelace,4)+(r.area_shoelace!=null?' '+u2:'')+'</td>'+
      '<td class="n">'+n(r.area_fourier,4)+(r.area_fourier!=null?' '+u2:'')+'</td>'+
      '<td class="n">'+n(r.perimeter,4)+(r.perimeter!=null?' '+u:'')+'</td>'+
      '<td class="n">'+(r.num_circles==null?'—':r.num_circles)+'</td></tr>';
  }).join('');
}

async function select(i){
  const r=R.rows[i]; if(!r) return;
  R.sel=r; R.circles=[]; R.cells=[];
  document.querySelectorAll('#rows tr').forEach(tr=>tr.classList.toggle('sel', +tr.dataset.i===i));
  const u=r.unit||'', u2=u+'²';
  $('detail').innerHTML=
    '<div class="panel"><h4>'+esc(r.image_name)+' · '+(r.scope==='trace'?'whole trace':'cell ['+r.cell_row+','+r.cell_col+']')+'</h4><div class="pb"><div class="kv">'+
    '<div>Saved</div><div>'+when(r.saved_at)+' by '+esc(r.saved_by)+'</div>'+
    '<div>Area Bézier (exact)</div><div>'+n(r.area_bezier,6)+' '+u2+'</div>'+
    '<div>Area Shoelace</div><div>'+n(r.area_shoelace,6)+' '+u2+'</div>'+
    '<div>Area Fourier</div><div>'+n(r.area_fourier,6)+' '+u2+'</div>'+
    (r.expected_area!=null?'<div>Expected / error</div><div>'+n(r.expected_area,6)+' '+u2+' · '+n(r.percent_error,4)+'%</div>':'')+
    '<div>Perimeter</div><div>'+n(r.perimeter,6)+' '+u+'</div>'+
    '<div>Bounding size</div><div>'+n(r.width,4)+' × '+n(r.height,4)+' '+u+'</div>'+
    '<div>Centre Z[0]</div><div>'+n(r.centroid_x,4)+', '+n(r.centroid_y,4)+' '+u+'</div>'+
    '<div>Direction</div><div>'+esc(r.direction)+'</div>'+
    '<div>Reconstruction error</div><div>'+n(r.recon_error,6)+' '+u+'</div>'+
    '<div>Calibration</div><div>'+n(r.cell_width,4)+' × '+n(r.cell_height,4)+' '+u+' per cell</div>'+
    '</div></div></div>'+
    '<div class="panel"><h4>Circles · Amplitude · Phase · Frequency</h4><div class="pb">'+
      '<button class="mode-btn" id="btnCsvCircles" style="margin-bottom:8px">Download circles CSV</button>'+
      '<div class="scroll"><table><thead><tr><th>#</th><th>Freq k</th><th>Amp ('+esc(u)+')</th><th>Phase°</th><th>Phase rad</th><th>Dir</th><th>Cum Area</th></tr></thead>'+
      '<tbody id="circRows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></div></div></div>'+
    (r.scope==='trace' ? '<div class="panel"><h4>Area per Cell</h4><div class="pb"><div class="scroll"><table><thead><tr><th>Cell</th><th>Area ('+esc(u2)+')</th><th>Coverage</th></tr></thead><tbody id="cellRows"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody></table></div></div></div>' : '');
  $('btnCsvCircles').addEventListener('click', downloadCircles);
  try{
    const [circ, cells] = await Promise.all([
      ResultsCSV.get('api/circles?id='+encodeURIComponent(r.id)),
      r.scope==='trace' ? ResultsCSV.get('api/cells?id='+encodeURIComponent(r.id)) : Promise.resolve({rows:[]})
    ]);
    if(R.sel!==r) return;                                  // another row was clicked meanwhile
    R.circles=(circ.rows||[]).map(typed).sort((a,b)=>a.rank-b.rank);
    R.cells=(cells.rows||[]).map(typed).sort((a,b)=>a.cell_row-b.cell_row||a.cell_col-b.cell_col);
    $('circRows').innerHTML = R.circles.length ? R.circles.map(c=>{
      const fc=c.freq_k>0?'fp':c.freq_k<0?'fn':'fz';
      return '<tr><td>'+c.rank+'</td><td class="'+fc+'">'+c.freq_k+'</td><td class="n">'+n(c.amplitude,6)+'</td><td class="n">'+n(c.phase_deg,2)+'°</td><td class="n">'+n(c.phase_rad,4)+'</td><td>'+esc(c.direction)+'</td><td class="n">'+n(c.cum_area,4)+'</td></tr>';
    }).join('') : '<tr><td colspan="7" class="empty">No circles stored.</td></tr>';
    if($('cellRows')) $('cellRows').innerHTML = R.cells.length ? R.cells.map(c=>
      '<tr><td>['+c.cell_row+','+c.cell_col+']</td><td class="n">'+n(c.area,4)+'</td><td class="n">'+n(c.coverage_pct,1)+'%</td></tr>').join('')
      : '<tr><td colspan="3" class="empty">No cell split stored.</td></tr>';
  }catch(err){
    $('circRows').innerHTML='<tr><td colspan="7" class="empty">Could not load: '+esc(err.message)+'</td></tr>';
  }
}

function csv(rows){ return rows.map(r=>r.map(v=>{ const s=v==null?'':String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n'); }
function save(text,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function downloadList(){
  const head=['saved_at','saved_by','image_name','image_id','scope','cell_row','cell_col','unit','area_bezier','area_shoelace','area_fourier',
              'perimeter','width','height','centroid_x','centroid_y','direction','recon_error','num_circles','expected_area','percent_error','measurement_id'];
  save(csv([head].concat(R.rows.map(r=>[r.saved_at,r.saved_by,r.image_name,r.image_id,r.scope,r.cell_row,r.cell_col,r.unit,r.area_bezier,r.area_shoelace,r.area_fourier,
    r.perimeter,r.width,r.height,r.centroid_x,r.centroid_y,r.direction,r.recon_error,r.num_circles,r.expected_area,r.percent_error,r.id]))), 'results-list.csv');
}
function downloadCircles(){
  const r=R.sel; if(!r || !R.circles.length) return;
  const head=['rank','freq_k','amplitude_'+(r.unit||''),'amplitude_px','phase_rad','phase_deg','direction','cum_area'];
  const base=(r.image_name||'image').replace(/\.[^.]+$/,'')+(r.scope==='trace'?'_trace':'_cell_'+r.cell_row+'-'+r.cell_col);
  save(csv([head].concat(R.circles.map(c=>[c.rank,c.freq_k,c.amplitude,c.amplitude_px,c.phase_rad,c.phase_deg,c.direction,c.cum_area]))), base+'_circles.csv');
}

(function boot(){
  R.all=[];
  const showWho = () => { $('who').textContent = 'logged in as '+ResultsCSV.saverName(false); };
  showWho(); window.addEventListener('session-user', showWho);
  $('btnLoad').addEventListener('click', load);
  $('btnCsvList').addEventListener('click', downloadList);
  $('btnName').addEventListener('click', ()=>{
    const me=ResultsCSV.saverName(false);
    $('fBy').value = $('fBy').value===me ? '' : me;          // toggle: only mine / everyone
    $('btnName').textContent = $('fBy').value ? 'Show everyone' : 'Show only mine';
    render();
  });
  ['fImage','fBy'].forEach(id=>$(id).addEventListener('input', render));
  ['fScope','fLatest'].forEach(id=>$(id).addEventListener('change', render));
  $('rows').addEventListener('click', e=>{ const tr=e.target.closest('tr[data-i]'); if(tr) select(+tr.dataset.i); });
  load();
})();
</script>
</body>
</html>
