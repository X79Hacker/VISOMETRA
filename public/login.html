<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VISOMETRA // Log In</title>
<style>
:root{
  --bg:#05060f;--bar:#080a16;--panel:#0a0c1a;--panel-2:#0c0f1c;
  --line:#1c2137;--line-2:#262c47;
  --green:#00ff9d;--red:#ff4d6a;--amber:#ffc400;
  --text:#dfe4f5;--text-dim:#8790b5;--text-mute:#565f85;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 30%,#0b0f1e,#04040c);color:var(--text);
  font-family:Consolas,'Courier New',ui-monospace,monospace;font-size:13px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line-2);padding:28px 26px}
h1{color:var(--green);font-size:16px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.sub{color:var(--text-mute);font-size:11px;letter-spacing:.6px;margin-bottom:22px}
label{display:block;color:var(--text-dim);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin:0 0 6px}
input{width:100%;background:var(--panel-2);border:1px solid var(--line-2);color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;outline:none;margin-bottom:14px}
input:focus{border-color:var(--green)}
button{width:100%;background:var(--green);color:#02160c;border:1px solid var(--green);padding:11px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;margin-top:4px}
button:hover{background:#2dffb8}
button:disabled{opacity:.5;cursor:wait}
.err{color:var(--red);font-size:12px;min-height:18px;margin-top:12px}
.note{color:var(--text-mute);font-size:10.5px;margin-top:14px;line-height:1.6}
</style>
<link rel="stylesheet" href="episodes/theme.css">
<script src="episodes/store.js"></script>
<link rel="stylesheet" href="episodes/polish.css">
</head>
<body>
<form class="box" id="form" autocomplete="on">
  <h1>VISOMETRA</h1>
  <div class="sub">Log in once — you stay logged in until you press Terminate.</div>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password">
  <button id="go" type="submit">Log in</button>
  <div class="err" id="err"></div>
  <div class="note">Everything you upload, draw, measure or delete is recorded under your username.</div>
</form>
<script>
"use strict";
const $ = id => document.getElementById(id);
function nextPage(){
  const n = new URLSearchParams(location.search).get('next');
  return (n && n.startsWith('/') && !n.startsWith('//') && !/^\/login(\.html)?($|\?)/.test(n)) ? n : 'dashboard-front.html';
}
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  $('go').disabled = true; $('err').textContent = '';
  try{
    const r = await fetch('api/login', { method:'POST', headers:{'Content-Type':'application/json'}, cache:'no-store',
      body: JSON.stringify({ username:$('u').value.trim(), password:$('p').value }) });
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || ('Could not log in (HTTP ' + r.status + ')'));
    // the pages read the name from here before they ask the server (session.js keeps it in sync)
    try{ localStorage.setItem('dash-user', j.user); localStorage.setItem('db-name', j.user); }catch(err){}
    location.replace(nextPage());
  }catch(err){
    $('err').textContent = err.message;
    $('p').value = ''; $('p').focus();
    $('go').disabled = false;
  }
});
</script>
</body>
</html>
